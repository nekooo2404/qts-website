server:
  port: ${PORT:8082}
  shutdown: graceful

spring:
  application:
    name: qts-event-service
  lifecycle:
    timeout-per-shutdown-phase: ${SPRING_SHUTDOWN_TIMEOUT:30s}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/qts}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_MAX_POOL_SIZE:8}
      minimum-idle: ${SPRING_DATASOURCE_MIN_IDLE:1}
      connection-timeout: 5000
      validation-timeout: 3000
  flyway:
    enabled: ${EVENT_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    table: flyway_schema_history_event_service
    baseline-on-migrate: ${EVENT_FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: ${EVENT_FLYWAY_BASELINE_VERSION:0}
    validate-on-migrate: true
  data:
    redis:
      url: ${QTS_EVENT_STREAM_URL:redis://localhost:6379/3}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:false}
  jackson:
    default-property-inclusion: non_null

management:
  health:
    mail:
      enabled: ${MANAGEMENT_HEALTH_MAIL_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

qts:
  events:
    poll-enabled: ${QTS_EVENT_POLL_ENABLED:false}
    poll-delay: ${QTS_EVENT_POLL_DELAY:PT5S}
    batch-size: ${QTS_EVENT_BATCH_SIZE:100}
    max-attempts: ${QTS_EVENT_CONSUMER_MAX_ATTEMPTS:8}
    stream-max-length: ${EVENT_STREAM_MAXLEN:100000}
    retry-base-delay: ${QTS_EVENT_RETRY_BASE_DELAY:PT1S}
    pending-idle: ${QTS_EVENT_PENDING_IDLE:PT6M}
    stream-name: ${EVENT_STREAM_NAME:qts.events}
    notification-group: notification
    consumer-name: ${QTS_EVENT_CONSUMER_NAME:spring-event-service}
    mail-enabled: ${QTS_EVENT_MAIL_ENABLED:false}
    max-recipients: ${QTS_EVENT_MAX_RECIPIENTS:50}
    max-body-length: ${QTS_EVENT_MAX_BODY_LENGTH:100000}
