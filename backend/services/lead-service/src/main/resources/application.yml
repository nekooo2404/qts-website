server:
  port: ${PORT:8081}
  shutdown: graceful

spring:
  application:
    name: qts-lead-service
  lifecycle:
    timeout-per-shutdown-phase: ${SPRING_SHUTDOWN_TIMEOUT:30s}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/qts}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_MAX_POOL_SIZE:10}
      minimum-idle: ${SPRING_DATASOURCE_MIN_IDLE:1}
      connection-timeout: 5000
      validation-timeout: 3000
  flyway:
    enabled: ${LEAD_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    table: flyway_schema_history_lead_service
    baseline-on-migrate: ${LEAD_FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: ${LEAD_FLYWAY_BASELINE_VERSION:0}
    validate-on-migrate: true
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

qts:
  platform:
    tenant-id: ${QTS_PLATFORM_TENANT_ID:00000000-0000-7000-8000-000000000001}
  leads:
    pow-prefix: ${LEAD_POW_PREFIX:000}
    notify-email: ${LEAD_NOTIFY_EMAIL:}
    event-source: qts.leads
    export-max-rows: ${LEAD_EXPORT_MAX_ROWS:5000}
    consultation-rate: ${LEAD_CONSULTATION_RATE:60/min}
  security:
    enabled: ${QTS_SECURITY_ENABLED:true}
    issuer: ${QTS_IDENTITY_ISSUER:}
    jwk-set-uri: ${QTS_IDENTITY_JWK_SET_URI:}
    audience: ${QTS_IDENTITY_AUDIENCE:qts-api}
