server:
  port: ${PORT:8086}
  shutdown: graceful

spring:
  application:
    name: qts-hrm-service
  lifecycle:
    timeout-per-shutdown-phase: ${SPRING_SHUTDOWN_TIMEOUT:30s}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/qts}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_MAX_POOL_SIZE:10}
      minimum-idle: ${SPRING_DATASOURCE_MIN_IDLE:1}
      connection-timeout: 5000
      validation-timeout: 3000
  flyway:
    enabled: ${HRM_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    schemas: hrm
    default-schema: hrm
    create-schemas: true
    baseline-on-migrate: ${HRM_FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: ${HRM_FLYWAY_BASELINE_VERSION:0}
    validate-on-migrate: true
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

qts:
  security:
    enabled: ${QTS_SECURITY_ENABLED:true}
    issuer: ${QTS_IDENTITY_ISSUER:}
    jwk-set-uri: ${QTS_IDENTITY_JWK_SET_URI:}
    audience: ${QTS_IDENTITY_AUDIENCE:qts-api}
    cors-allowed-origins: ${QTS_SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:3018,http://localhost:5174,http://localhost:5175}
  hrm:
    max-page-size: ${HRM_MAX_PAGE_SIZE:100}
