      ORY_KRATOS_INTERNAL_PUBLIC_URL: ${ORY_KRATOS_INTERNAL_PUBLIC_URL:?ORY_KRATOS_INTERNAL_PUBLIC_URL required}
      ORY_KRATOS_ADMIN_URL: ${ORY_KRATOS_ADMIN_URL:?ORY_KRATOS_ADMIN_URL required}
      ORY_KRATOS_SESSION_COOKIE: ${ORY_KRATOS_SESSION_COOKIE:-ory_kratos_session}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:-health,info}

  identity-bridge-service:
    restart: unless-stopped
    mem_limit: 192m
    ports: !reset []
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
