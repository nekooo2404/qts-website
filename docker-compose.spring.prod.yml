      ORY_HYDRA_ISSUER_BROWSER_URL: ${ORY_HYDRA_ISSUER_BROWSER_URL:?ORY_HYDRA_ISSUER_BROWSER_URL required}
      ORY_HYDRA_ADMIN_URL: ${ORY_HYDRA_ADMIN_URL:?ORY_HYDRA_ADMIN_URL required}
      ORY_KRATOS_BROWSER_URL: ${ORY_KRATOS_BROWSER_URL:?ORY_KRATOS_BROWSER_URL required}
      ORY_KRATOS_INTERNAL_PUBLIC_URL: ${ORY_KRATOS_INTERNAL_PUBLIC_URL:?ORY_KRATOS_INTERNAL_PUBLIC_URL required}
      ORY_KRATOS_ADMIN_URL: ${ORY_KRATOS_ADMIN_URL:?ORY_KRATOS_ADMIN_URL required}
      ORY_API_AUDIENCE: ${ORY_API_AUDIENCE:?ORY_API_AUDIENCE required}
      ORY_KRATOS_SESSION_COOKIE: ${ORY_KRATOS_SESSION_COOKIE:-ory_kratos_session}
      ORY_HYDRA_CLIENT_ID_PORTAL: ${ORY_HYDRA_CLIENT_ID_PORTAL:?ORY_HYDRA_CLIENT_ID_PORTAL required}
