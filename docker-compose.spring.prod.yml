services:
  lead-service:
    restart: unless-stopped
    mem_limit: 256m
    ports: !reset []
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    environment:
      LEAD_FLYWAY_ENABLED: ${LEAD_FLYWAY_ENABLED:?LEAD_FLYWAY_ENABLED required}
      QTS_SECURITY_ENABLED: ${QTS_SECURITY_ENABLED:?QTS_SECURITY_ENABLED required}
      QTS_IDENTITY_ISSUER: ${QTS_IDENTITY_ISSUER:?QTS_IDENTITY_ISSUER required}
      QTS_IDENTITY_JWK_SET_URI: ${QTS_IDENTITY_JWK_SET_URI:?QTS_IDENTITY_JWK_SET_URI required}
      QTS_IDENTITY_AUDIENCE: ${QTS_IDENTITY_AUDIENCE:?QTS_IDENTITY_AUDIENCE required}
      QTS_SECURITY_CORS_ALLOWED_ORIGINS: ${QTS_SECURITY_CORS_ALLOWED_ORIGINS:?QTS_SECURITY_CORS_ALLOWED_ORIGINS required}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:-health,info}

  event-service:
    restart: unless-stopped
    mem_limit: 192m
    ports: !reset []
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    environment:
      EVENT_FLYWAY_ENABLED: ${EVENT_FLYWAY_ENABLED:?EVENT_FLYWAY_ENABLED required}
      QTS_EVENT_POLL_ENABLED: ${QTS_EVENT_POLL_ENABLED:?QTS_EVENT_POLL_ENABLED required}
      QTS_EVENT_MAIL_ENABLED: ${QTS_EVENT_MAIL_ENABLED:?QTS_EVENT_MAIL_ENABLED required}
      MANAGEMENT_HEALTH_MAIL_ENABLED: ${MANAGEMENT_HEALTH_MAIL_ENABLED:-false}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:-health,info}

  attendance-service:
    restart: unless-stopped
    mem_limit: 256m
    ports: !reset []
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    environment:
      ATTENDANCE_FLYWAY_ENABLED: ${ATTENDANCE_FLYWAY_ENABLED:?ATTENDANCE_FLYWAY_ENABLED required}
      QTS_SECURITY_ENABLED: ${QTS_SECURITY_ENABLED:?QTS_SECURITY_ENABLED required}
      QTS_IDENTITY_ISSUER: ${QTS_IDENTITY_ISSUER:?QTS_IDENTITY_ISSUER required}
      QTS_IDENTITY_JWK_SET_URI: ${QTS_IDENTITY_JWK_SET_URI:?QTS_IDENTITY_JWK_SET_URI required}
      QTS_IDENTITY_AUDIENCE: ${QTS_IDENTITY_AUDIENCE:?QTS_IDENTITY_AUDIENCE required}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:-health,info}

  identity-admin-service:
    restart: unless-stopped
    mem_limit: 256m
    ports: !reset []
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    environment:
      QTS_SECURITY_ENABLED: ${QTS_SECURITY_ENABLED:?QTS_SECURITY_ENABLED required}
      QTS_IDENTITY_ISSUER: ${QTS_IDENTITY_ISSUER:?QTS_IDENTITY_ISSUER required}
      QTS_IDENTITY_JWK_SET_URI: ${QTS_IDENTITY_JWK_SET_URI:?QTS_IDENTITY_JWK_SET_URI required}
      QTS_IDENTITY_AUDIENCE: ${QTS_IDENTITY_AUDIENCE:?QTS_IDENTITY_AUDIENCE required}
      QTS_SECURITY_CORS_ALLOWED_ORIGINS: ${QTS_SECURITY_CORS_ALLOWED_ORIGINS:?QTS_SECURITY_CORS_ALLOWED_ORIGINS required}
      IDENTITY_FLYWAY_ENABLED: ${IDENTITY_FLYWAY_ENABLED:?IDENTITY_FLYWAY_ENABLED required}
      QTS_IDENTITY_BOOTSTRAP_ENABLED: ${QTS_IDENTITY_BOOTSTRAP_ENABLED:?QTS_IDENTITY_BOOTSTRAP_ENABLED required}
      IDENTITY_PRIMARY_DOMAIN: ${IDENTITY_PRIMARY_DOMAIN:?IDENTITY_PRIMARY_DOMAIN required}
      IDENTITY_REQUIRE_MFA: ${IDENTITY_REQUIRE_MFA:?IDENTITY_REQUIRE_MFA required}
      VITE_PORTAL_OIDC_REDIRECT_URI: ${VITE_PORTAL_OIDC_REDIRECT_URI:?VITE_PORTAL_OIDC_REDIRECT_URI required}
