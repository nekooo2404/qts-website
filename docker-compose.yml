name: ${COMPOSE_PROJECT_NAME:-qtsss}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qts}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - qts_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 5
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  hydra-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hydra
      POSTGRES_USER: hydra
      POSTGRES_PASSWORD: ${ORY_HYDRA_DB_PASSWORD:?ORY_HYDRA_DB_PASSWORD required}
    volumes:
      - qts_hydra_postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U hydra -d hydra"]
      interval: 5s
      timeout: 3s
      retries: 10
  kratos-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kratos
      POSTGRES_USER: kratos
      POSTGRES_PASSWORD: ${ORY_KRATOS_DB_PASSWORD:?ORY_KRATOS_DB_PASSWORD required}
    volumes:
      - qts_kratos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U kratos -d kratos"]
      interval: 5s
      timeout: 3s
      retries: 10
  hydra-migrate:
    image: oryd/hydra:v26.2.0
    command: migrate sql -e --yes
    environment:
      DSN: ${ORY_HYDRA_DSN:?ORY_HYDRA_DSN required}
    depends_on:
      hydra-db:
        condition: service_healthy
  kratos-migrate:
    image: oryd/kratos:v26.2.0
    command: migrate sql -e --yes
    environment:
      DSN: ${ORY_KRATOS_DSN:?ORY_KRATOS_DSN required}
    depends_on:
      kratos-db:
        condition: service_healthy
  hydra:
    image: oryd/hydra:v26.2.0
    command: serve all --dev -c /etc/ory/hydra.yml
    environment:
      DSN: ${ORY_HYDRA_DSN:?ORY_HYDRA_DSN required}
      SECRETS_SYSTEM: ${ORY_HYDRA_SYSTEM_SECRET:?ORY_HYDRA_SYSTEM_SECRET required}
      URLS_SELF_ISSUER: ${ORY_HYDRA_ISSUER_BROWSER_URL:-http://localhost:4444/}
      URLS_LOGIN: ${ORY_HYDRA_LOGIN_URL:-${IDENTITY_WEB_ORIGIN:-http://localhost:3001}/identity-api/oauth/ory/login}
      URLS_CONSENT: ${ORY_HYDRA_CONSENT_URL:-${IDENTITY_WEB_ORIGIN:-http://localhost:3001}/identity-api/oauth/ory/consent}
      URLS_LOGOUT: ${ORY_HYDRA_LOGOUT_URL:-${IDENTITY_WEB_ORIGIN:-http://localhost:3001}/identity-api/oauth/ory/logout}
      URLS_POST_LOGOUT_REDIRECT: ${IDENTITY_WEB_ORIGIN:-http://localhost:3001}/login
    volumes:
      - ./infra/ory:/etc/ory:ro
    ports:
      - "127.0.0.1:4444:4444"
      - "127.0.0.1:4445:4445"
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:4445/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
  kratos:
    image: oryd/kratos:v26.2.0
    command: serve --dev --watch-courier -c /etc/ory/kratos.yml
    environment:
      DSN: ${ORY_KRATOS_DSN:?ORY_KRATOS_DSN required}
      SECRETS_COOKIE: ${ORY_KRATOS_COOKIE_SECRET:?ORY_KRATOS_COOKIE_SECRET required}
      SECRETS_CIPHER: ${ORY_KRATOS_CIPHER_SECRET:?ORY_KRATOS_CIPHER_SECRET required}
      COURIER_SMTP_CONNECTION_URI: ${ORY_SMTP_CONNECTION_URI:-smtp://mailpit:1025/?disable_starttls=true}
    volumes:
      - ./infra/ory:/etc/ory:ro
    ports:
      - "127.0.0.1:4433:4433"
      - "127.0.0.1:4434:4434"
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:4434/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
  mailpit:
    image: axllent/mailpit:v1.27
    profiles: [dev-mail]
    ports:
      - "127.0.0.1:8025:8025"
volumes:
  qts_postgres:
  qts_hydra_postgres:
  qts_kratos_postgres:
