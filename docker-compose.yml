services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qts}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Buiduchoa2404}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - qts_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qts"]
      interval: 5s
      timeout: 3s
      retries: 5
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  keycloak-db-init:
    image: postgres:16-alpine
    command: >-
      sh -c 'until pg_isready -h db -U postgres -d qts; do sleep 1; done;
      psql -h db -U postgres -d qts -c "CREATE SCHEMA IF NOT EXISTS keycloak AUTHORIZATION postgres;"'
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-Buiduchoa2404}
    depends_on:
      db:
        condition: service_healthy
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: start --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/qts
      KC_DB_USERNAME: ${POSTGRES_USER:-postgres}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-Buiduchoa2404}
      KC_DB_SCHEMA: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin-local}
      KC_HTTP_PORT: "8080"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      keycloak-db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\n\r\n' >&3 && grep -q '200\\|UP' <&3"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  api:
    build:
      context: ./apps/api
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./apps/api:/app
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: local-development-key
      POSTGRES_DB: ${POSTGRES_DB:-qts}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Buiduchoa2404}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:5174
      IDENTITY_ISSUER: http://localhost:8000
      IDENTITY_WEB_ORIGIN: http://localhost:3001
      IDENTITY_SIGNING_KEY_PASSPHRASE: local-identity-key-encryption-only
      IDENTITY_PROVIDER: keycloak
      KEYCLOAK_ISSUER: http://localhost:8081/realms/qts
      KEYCLOAK_INTERNAL_ISSUER: http://keycloak:8080/realms/qts
      KEYCLOAK_AUDIENCE: account
      REDIS_URL: redis://redis:6379/1
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
  identity:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "npm install && npm run dev --workspace=@qts/identity"
    volumes:
      - ./:/workspace
    environment:
      IDENTITY_API_ORIGIN: http://api:8000
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      - api

  # Production services
  web-prod:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    profiles: ["prod"]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - api

  portal-prod:
    build:
      context: .
      dockerfile: apps/portal/Dockerfile
      args:
        VITE_IDENTITY_ISSUER: ${VITE_IDENTITY_ISSUER:-http://localhost:8081/realms/qts}
        VITE_API_ISSUER: ${VITE_API_ISSUER:-http://localhost:8000}
        VITE_PORTAL_OIDC_CLIENT_ID: ${VITE_PORTAL_OIDC_CLIENT_ID:-qts-portal}
        VITE_IDENTITY_WEB_ORIGIN: ${VITE_IDENTITY_WEB_ORIGIN:-http://localhost:3001}
        VITE_PORTAL_OIDC_REDIRECT_URI: ${VITE_PORTAL_OIDC_REDIRECT_URI:-http://localhost:5174/auth/callback}
        VITE_PORTAL_OIDC_POST_LOGOUT_REDIRECT_URI: ${VITE_PORTAL_OIDC_POST_LOGOUT_REDIRECT_URI:-http://localhost:5174/}
    profiles: ["prod"]
    ports:
      - "127.0.0.1:5174:80"
    depends_on:
      - api

  identity-prod:
    build:
      context: .
      dockerfile: apps/identity/Dockerfile
    profiles: ["prod"]
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      NODE_ENV: production
      IDENTITY_API_ORIGIN: http://api:8000
    depends_on:
      - api

volumes:
  qts_postgres:
